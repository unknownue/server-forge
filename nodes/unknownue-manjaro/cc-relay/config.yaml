# cc-relay Configuration — unknownue-manjaro
#
# Proxy for Claude Code to route requests across multiple AI providers.

server:
  listen: "127.0.0.1:8787"
  timeout_ms: 600000
  max_concurrent: 0
  enable_http2: true

  auth:
    allow_subscription: true

routing:
  strategy: "failover"
  failover_timeout: 5000
  debug: false

providers:
  - name: "anthropic"
    type: "anthropic"
    enabled: true
    models:
      - "claude-opus-4-6"
      - "claude-sonnet-4-5-20250514"
      - "claude-haiku-4-5-20251001"
    keys:
      - key: "${ANTHROPIC_API_KEY}"
        rpm_limit: 60
        tpm_limit: 100000

  - name: "ollama"
    type: "ollama"
    enabled: true
    base_url: "http://localhost:11434"
    model_mapping:
      "claude-opus-4-6": "qwen3:72b"
      "claude-sonnet-4-5-20250514": "qwen3:32b"
      "claude-sonnet-4-5": "qwen3:32b"
      "claude-haiku-4-5-20251001": "qwen3:8b"
      "claude-haiku-4-5": "qwen3:8b"

cache:
  mode: single
  ristretto:
    num_counters: 1000000
    max_cost: 104857600
    buffer_items: 64

grpc:
  listen: "127.0.0.1:9090"

logging:
  level: "info"
  format: "text"

metrics:
  enabled: true
  prometheus_endpoint: "/metrics"
  prometheus_listen: "127.0.0.1:9100"

health:
  health_check:
    enabled: true
    interval_ms: 10000
  circuit_breaker:
    failure_threshold: 5
    open_duration_ms: 30000
    half_open_probes: 3
