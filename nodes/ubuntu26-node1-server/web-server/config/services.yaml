# Web Studio Server — Service Definitions
# Maps service types to GPU allocations, models, ports, and quantization.
#
# All models run FP8 runtime quantization (--quantization fp8). FP8 KV cache
# (--kv-cache-dtype fp8_e5m2) on all instances. MoE FP8 kernel compatibility
# is assumed resolved (SGLang/Triton update).
# No image generation — all 4 GPUs dedicated to text inference.
#
# Date: 2026-05-28

version: "3.0"

# ── GPU Topology ──
gpu_topology:
  total_gpus: 4
  gpu_model: "NVIDIA RTX 6000D"
  vram_per_gpu_gb: 85.6
  interconnect: "PCIe Gen5"
  numa_nodes: 1
  p2p_enabled: true

# ── Default Plan: 3×27B FP8 + 35B-A3B BF16 (MoE) ──
default:
  description: "Triple 27B interchangeable pool + MoE for code gen"
  download_required:
    - "Qwen/Qwen3.6-35B-A3B"
  total_throughput_tok_s: 586
  note: "27B pool (3×82.8) + MoE (338.1) = ~586 tok/s"

  text_instances:
    - name: "ws-27b-a"
      gpu: [0]
      tp: 1
      port: 8000
      model: "Qwen/Qwen3.6-27B"
      quantization: "fp8"
      context_length: 40960
      purpose: "General purpose, architecture, cross-file reasoning"
      measured_tok_s: 82.8
      concurrent_8k: 29
      memory:
        weights_gb: 26
        kv_cache_gb: 57.6
        per_token_kv_kb: 256

    - name: "ws-35b-moe-code"
      gpu: [1]
      tp: 1
      port: 8001
      model: "Qwen/Qwen3.6-35B-A3B"
      quantization: "fp8"
      context_length: 40960
      purpose: "Code generation (MoE 35B total, 3B active/token — 4× faster than 27B Dense)"
      measured_tok_s: 338.1
      concurrent_8k: 48
      memory:
        weights_gb: 35
        kv_cache_gb: 48.6
        per_token_kv_kb: 256
      architecture: "Mixture of Experts — 35B params, 3B activated per token"
      note: "FP8 reduces weights 70→35 GB; KV Cache 13.6→48.6 GB (+257%)"

    - name: "ws-27b-b"
      gpu: [2]
      tp: 1
      port: 8002
      model: "Qwen/Qwen3.6-27B"
      quantization: "fp8"
      context_length: 40960
      purpose: "General purpose, DB schema design, UI/UX, QA"
      measured_tok_s: 82.7
      concurrent_8k: 29
      memory:
        weights_gb: 26
        kv_cache_gb: 57.6

    - name: "ws-27b-c"
      gpu: [3]
      tp: 1
      port: 8003
      model: "Qwen/Qwen3.6-27B"
      quantization: "fp8"
      context_length: 40960
      purpose: "General purpose, security audit, DevOps config"
      measured_tok_s: 82.7
      concurrent_8k: 29
      memory:
        weights_gb: 26
        kv_cache_gb: 57.6

  api_proxy:
    - name: "ws-proxy"
      port: 8090
      image: "server-forge/anthropic-proxy:latest"
      purpose: "API format translation — Anthropic Messages API ↔ OpenAI Chat Completions"
      runtime:
        memory_mb: 100
        cpu_cores: 0.1
        gpu: false
      routing:
        Qwen3.6-27B-FP8:     { default_target: ":8000", pool: [":8000", ":8002", ":8003"] }
        Qwen3.6-35B-A3B-FP8: { target: ":8001" }
      fuzzy:
        "35B/A3B/MoE": ":8001"
        "27B/72B/32B": ":8000"
      endpoints:
        - "/v1/messages          (Anthropic Messages API)"
        - "/v1/chat/completions  (OpenAI passthrough)"
      note: "Runs on CPU — <1ms translation overhead. :8000 is default for 27B."

# ── Plan 72B: Largest Dense Model ──
plan_72b:
  description: "72B Dense for complex reasoning + 2×27B for throughput"
  download_required:
    - "Qwen/Qwen3-72B"

  text_instances:
    - name: "ws-72b"
      gpu: [0, 1]
      tp: 2
      port: 8000
      model: "Qwen/Qwen3-72B"
      quantization: "fp8"
      context_length: 65536
      purpose: "Complex architecture decisions, multi-file deep analysis"
      expected_tok_s: 250
      concurrent_8k: 38
      memory:
        weights_gb: 72
        kv_cache_per_gpu_gb: 47.6

    - name: "ws-27b-a"
      gpu: [2]
      tp: 1
      port: 8001
      model: "Qwen/Qwen3.6-27B"
      quantization: "fp8"
      context_length: 40960
      purpose: "Code generation + general purpose"
      expected_tok_s: 83
      concurrent_8k: 29

    - name: "ws-27b-b"
      gpu: [3]
      tp: 1
      port: 8002
      model: "Qwen/Qwen3.6-27B"
      quantization: "fp8"
      context_length: 40960
      purpose: "General purpose + QA"
      expected_tok_s: 83
      concurrent_8k: 29

