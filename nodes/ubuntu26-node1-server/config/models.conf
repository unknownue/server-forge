# Model registry for ubuntu26-node1-server.
# Format: "MODEL_ID|REVISION|FORMAT"
# FORMAT is optional (defaults to safetensors).
#   safetensors — safetensors weights + common configs/tokenizer
#   gguf        — all GGUF files + common configs/tokenizer
#   gguf:<quant> — GGUF matching <quant> + common (e.g. gguf:Q4_K_M)
#   full        — no filtering
#   "-"         — explicit default (same as safetensors)
#   <glob> ...  — custom allow_patterns
MODELS=(
    # ── Text inference (SGLang DSPARK) ──
    "RadixArk/Qwen3.8-27B-DSpark|main"
    "RadixArk/Qwen3.8-27B-NVFP4|main"
    # ── DeepSeek-V4.1-Flash (full checkpoint, 475 GB) ──
    "deepseek-ai/DeepSeek-V4.1-Flash|fb2764a5cf321eaa5070ca8f9e892818f477c16d|full"
    # ── MiMo-V2.6-Flash-RL (MXFP4 experts + FP8 dense, 178 GB, sm_120 serving) ──
    # 'full' is required: --trust-remote-code needs modeling_mimo_v2.py /
    # configuration_mimo_v2.py, and DFlash + audio tokenizer files live in subdirs.
    "XiaomiMiMo/MiMo-V2.6-Flash-RL|5711b268169967567844e1e560e8a3966da959b1|full"
)
