  download_required:
    - "deepseek-ai/DeepSeek-R1-Distill-Qwen-32B"
    - "Qwen/Qwen3.6-35B-A3B"

  text_instances:
    - name: "ws-r1-reason"
      gpu: [0]
      tp: 1
      port: 8000
      model: "deepseek-ai/DeepSeek-R1-Distill-Qwen-32B"
      quantization: "fp8"
      context_length: 65536
      purpose: "Deep chain-of-thought reasoning, complex debugging, architecture analysis"
      expected_tok_s: 350
      concurrent_8k: 53

    - name: "ws-35b-moe-code"
      gpu: [1]
      tp: 1
      port: 8001
      model: "Qwen/Qwen3.6-35B-A3B"
      quantization: "fp8"
      context_length: 40960
      purpose: "Code generation (MoE 35B→3B active)"
      measured_tok_s: 338
      concurrent_8k: 48

    - name: "ws-27b-a"
      gpu: [2]
      tp: 1
      port: 8002
      model: "Qwen/Qwen3.6-27B"
      quantization: "fp8"
      context_length: 40960
      purpose: "General purpose + multimodal"
      measured_tok_s: 83
      concurrent_8k: 29

    - name: "ws-27b-b"
      gpu: [3]
      tp: 1
      port: 8003
      model: "Qwen/Qwen3.6-27B"
      quantization: "fp8"
      context_length: 40960
      purpose: "General purpose + QA"
      measured_tok_s: 83
      concurrent_8k: 29

# ── Agent-to-Service Routing (Web Dev) ──
agent_routing:
  architecture_design:
    all: { target: "27B pool", ports: [8000, 8002, 8003], model: "Qwen3.6-27B-FP8" }

  code_generation:
    all: { target: "MoE", port: 8001, model: "Qwen3.6-35B-A3B-FP8" }

  database_design:
    all: { target: "27B pool", ports: [8000, 8002, 8003] }

  ui_ux_review:
    all: { target: "27B pool", ports: [8000, 8002, 8003] }

  security_audit:
    all: { target: "27B pool", ports: [8000, 8002, 8003] }

  qa_testing:
    all: { target: "27B pool", ports: [8000, 8002, 8003] }

  devops_config:
    all: { target: "MoE", port: 8001 }

  fast_iteration:
    all: { target: "MoE", port: 8001 }

# ── Model Architecture Reference ──
models:
  Qwen3.6-27B:
    type: "Dense Transformer"
    multimodal: true
    vision_encoder: "27-layer, 1152-dim hidden, 5120-dim output"
    fp8_weight_gb: 26
    kv_per_token_kb: 256
    layers: { full_attention: 16, linear_attention: 48, total: 64 }

  Qwen3.6-35B-A3B:
    type: "Mixture of Experts (MoE)"
    total_params: "35B"
    active_per_token: "3B"
    fp8_weight_gb: 35
    kv_per_token_kb: 256
    note: "Wide knowledge (35B params) + fast inference (3B compute) — ideal for code generation"

  DeepSeek-R1-Distill-Qwen-32B:
    type: "Dense Transformer with CoT reasoning"
    fp8_weight_gb: 31
    kv_per_token_kb: 256
    note: "Chain-of-thought reasoning specialist"

# ── Quantization Reference ──
quantization:
  fp8:
    method: "Runtime quantization via SGLang --quantization fp8"
    weight_size: "50% of BF16"
    quality_loss: "<1% on benchmarks"
    kv_cache: "--kv-cache-dtype fp8_e5m2 (additional 2x KV cache savings)"
