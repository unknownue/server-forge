# Model registry for ubuntu26-node1-server.
# Format: "MODEL_ID|REVISION|FORMAT"
# FORMAT is optional (defaults to safetensors).
#   safetensors — safetensors weights + common configs/tokenizer
#   gguf        — all GGUF files + common configs/tokenizer
#   gguf:<quant> — GGUF matching <quant> + common (e.g. gguf:Q4_K_M)
#   full        — no filtering
#   "-"         — explicit default (same as safetensors)
#   <glob> ...  — custom allow_patterns
MODELS=(
    # ── Text inference (SGLang FP8) ──
    "Qwen/Qwen3.6-27B|main"
    "Qwen/Qwen3.6-27B-FP8|main"
    "Qwen/Qwen3.6-35B-A3B|main"
    "LordNeel/DeepSeek-V4-Flash-Acti-MTP-W4A16-FP8|main"

    # ── Image generation (ComfyUI FP8) ──
    # Only FP8 variants: skip BF16/FP4 text encoders
    "Comfy-Org/flux2-dev|main|split_files/vae/flux2-vae.safetensors split_files/diffusion_models/flux2_dev_fp8mixed.safetensors split_files/text_encoders/mistral_3_small_flux2_fp8.safetensors split_files/loras/Flux_2-Turbo-LoRA_comfyui.safetensors split_files/loras/Flux2TurboComfyv2.safetensors"

    # ── Experimental / alternative formats ──
    "unsloth/Qwen3.6-27B-NVFP4|main"
    "unsloth/Qwen3.6-27B-MTP-GGUF|main|gguf:Q4_K_M"
)
