# DeepSeek-V4-Flash — Service Definitions
#
# vLLM-based deployment using patched jasl/vllm fork + Acti MTP patches.
# W4A16 INT4 routed experts + FP8_BLOCK attention + MTP speculative decoding.
#
# Validated against:
#   - LordNeel/DeepSeek-V4-Flash-Acti-MTP-W4A16-FP8 model card (2×96GB benchmarks)
#   - AIServerSetup DS4-Flash production config
#
# Date: 2026-06-01

version: "3.0"

# ── GPU Topology ──
gpu_topology:
  total_gpus: 2
  gpu_model: "NVIDIA RTX 6000D"
  vram_per_gpu_gb: 85.6
  total_vram_gb: 171.2
  interconnect: "PCIe Gen5"
  note: "No NVLink — disable-custom-all-reduce required. W4A16 model (~145 GB) requires 2 GPUs TP=2."
  reference_hardware: "2× RTX PRO 6000 Blackwell Max-Q 96GB = 192 GB (model card benchmarks)"
  our_ratio: "89% of reference VRAM"

# ── Docker Image ──
image:
  name: "dsv4-flash-acti-mtp"
  tag: "0.1.0"
  backend: "vLLM (jasl/vllm@abad5dc7 + CT quant + Acti MTP patches)"
  build: "bash docker/build.sh"
  shm_size: "64g"

# ── NCCL / Env Tuning (from Acti validated set) ──
nccl_env:
  NCCL_P2P_DISABLE: "1"        # No NVLink → disable CUDA P2P
  NCCL_IB_DISABLE: "1"         # No InfiniBand
  NCCL_SHM_DISABLE: "0"        # Keep shared-memory transport
  NCCL_PROTO: "LL"             # Low-latency protocol for small TP messages
  NCCL_ALGO: "Ring"            # Ring algorithm (no NVLink tree)
  NCCL_MIN_NCHANNELS: "8"      # Tuned — reduces TTFT ~40%
  NCCL_NTHREADS: "512"         # Sufficient for 2-GPU allreduce
  NCCL_DEBUG: "WARN"
  VLLM_USE_FLASHINFER_SAMPLER: "0"
  VLLM_ENABLE_DEEPSEEK_V4_SPARSE_MLA_WARMUP: "0"

# ═══════════════════════════════════════════════════════════════════════════
# Profiles (validated on 2×96GB, scaled for 2×85.6GB)
# ───────────────────────────────────────────────────────────────────────────
# Model weights (W4A16): ~145 GB
# MLA KV cache: ~27 KB/token (FP8, kv_lora_rank=512, qk_rope_dim=64)
# At 0.93 util: 159.2 GB → ~14.2 GB KV → ~526K tokens
# At 0.90 util: 154.1 GB →  ~9.1 GB KV → ~337K tokens
# ═══════════════════════════════════════════════════════════════════════════

# ── Default: 128K × 3 — balanced multi-user ──
default:
  description: "128K context, 3 concurrent (KV ~10.6 GB, 25% headroom)"
  text_instances:
    - name: "dsv4-flash"
      gpu: [0, 1]
      tp: 2
      port: 8000
      model: "LordNeel/DeepSeek-V4-Flash-Acti-MTP-W4A16-FP8"
      max_model_len: 131072
      max_num_seqs: 3
      max_num_batched_tokens: 8192
      gpu_memory_utilization: 0.93
      enable_mtp: true
      block_size: 256
      purpose: "Balanced multi-user — agent work, code review, general chat"
      estimated_tps: 200

# ── plan-long: 256K × 2 — deep analysis, RAG ──
plan_long:
  description: "256K context, 2 concurrent (KV ~14.2 GB, tight fit)"
  text_instances:
    - name: "dsv4-flash-long"
      gpu: [0, 1]
      tp: 2
      port: 8000
      model: "LordNeel/DeepSeek-V4-Flash-Acti-MTP-W4A16-FP8"
      max_model_len: 262144
      max_num_seqs: 2
      max_num_batched_tokens: 8192
      gpu_memory_utilization: 0.93
      enable_mtp: true
      block_size: 256
      purpose: "Deep analysis, long documents, RAG, codebase review"
      estimated_tps: 150

# ── plan-524k: 524K × 1 — solo max-context ──
plan_524k:
  description: "524K context, 1 concurrent (KV ~14.2 GB, tight fit)"
  text_instances:
    - name: "dsv4-flash-524k"
      gpu: [0, 1]
      tp: 2
      port: 8000
      model: "LordNeel/DeepSeek-V4-Flash-Acti-MTP-W4A16-FP8"
      max_model_len: 524288
      max_num_seqs: 1
      max_num_batched_tokens: 8192
      gpu_memory_utilization: 0.93
      enable_mtp: true
      block_size: 256
      purpose: "Solo max-context — full codebase analysis, multi-file reasoning"
      estimated_tps: 85

# ── plan-high: 64K × 5 — agent fleet ──
plan_high:
  description: "64K context, 5 concurrent (KV ~8.9 GB, 2% headroom — tight)"
  text_instances:
    - name: "dsv4-flash-high"
      gpu: [0, 1]
      tp: 2
      port: 8000
      model: "LordNeel/DeepSeek-V4-Flash-Acti-MTP-W4A16-FP8"
      max_model_len: 65536
      max_num_seqs: 5
      max_num_batched_tokens: 16384
      gpu_memory_utilization: 0.90
      enable_mtp: true
      block_size: 256
      purpose: "Agent fleet, high-concurrency multi-user, quick tasks"
      estimated_tps: 250

# ── Model Architecture Reference ──
models:
  DeepSeek-V4-Flash:
    type: "MoE Transformer + MLA + MTP"
    total_params: "284B (13B activated)"
    decoder_layers: 43
    mtp_layers: 1
    routed_experts_per_layer: 256
    top_k: 6
    routing: "noaux_tc"
    attention: "MLA (Multi-head Latent Attention)"
    kv_lora_rank: 512
    qk_rope_head_dim: 64
    hidden_size: 4096
    routed_expert_intermediate: 2048
    vocab_size: 129280
    max_position_embeddings: 1048576
    num_nextn_predict_layers: 1
    quantization:
      routed_experts: "W4A16 INT4 group=128 sym (GPTQ)"
      attention: "FP8_BLOCK 128×128"
      shared_experts: "BF16"
      mtp_attention: "FP8_BLOCK 128×128"
    vram_gb: 145
    kv_per_token_kb: 27
    served_model_names:
      - "deepseek-v4-flash"
      - "deepseek-v4-flash-mtp"
      - "DSV4-W4A16-FP8"
      - "deepseek-ai/DeepSeek-V4-Flash"
    tokenizer: "deepseek_v4"
    tool_calling: "deepseek_v4 parser + auto-tool-choice"
    reasoning: "deepseek_v4 parser (thinking/content split)"

# ── Model Card Benchmarks (2×96GB, for reference) ──
model_card_benchmarks:
  hardware: "2× RTX PRO 6000 Blackwell Max-Q 96GB"
  profiles:
    - { context: 131072, concurrent: 8, util: 0.90, tps: 467 }
    - { context: 262144, concurrent: 4, util: 0.95, tps: 296 }
    - { context: 524288, concurrent: 3, util: 0.93, tps: 138 }
  single_stream_524k_tps: 87
  single_stream_128k_tps: 111
  mtp_speedup: "1.62× vs no-MTP baseline"
