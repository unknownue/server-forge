# Nginx load balancer template for Game Studio Server.
# __UPSTREAM_SERVERS__ is replaced by deploy.sh at runtime.

events {
    worker_connections 1024;
}

http {
    upstream game_llm_backend {
        least_conn;
__UPSTREAM_SERVERS__
    }

    server {
        listen 8080;

        # Max request size for long prompts
        client_max_body_size 10m;

        location / {
            proxy_pass http://game_llm_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Long timeouts for LLM inference
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
        }

        location /health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
