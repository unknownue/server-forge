# Multica self-host stack — mac-mini-m4
#
# Derived from submodules/multica/docker-compose.selfhost.yml, kept as an
# independent copy so this node does not depend on the submodule. Deltas from
# upstream are marked with "# [mac-mini-m4]" and explained inline.
#
# Usage:
#   bash deploy.sh                     # recommended (handles .env + image pull)
#   docker compose up -d               # once .env exists and images are present
#
# Ports:
#   Caddy     0.0.0.0:3000   ← the only LAN-facing listener (see ../caddy/)
#   frontend  127.0.0.1:3001 ← moved off 3000 so Caddy can own it
#   backend   127.0.0.1:8080 ← for the multica CLI and debugging
#   postgres  not published  ← reachable only by the backend, over multica-net

name: multica

services:
  postgres:
    # [mac-mini-m4] No `ports:` block. Upstream publishes 127.0.0.1:5432 for
    # convenience; nothing on this node needs host access to the database, and
    # a published port is one more listener to reason about. Use
    # `docker compose exec postgres psql -U multica` instead.
    image: pgvector/pgvector:pg17
    container_name: multica-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-multica}
      POSTGRES_USER: ${POSTGRES_USER:-multica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multica}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - multica-net
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-multica} -d ${POSTGRES_DB:-multica}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ${MULTICA_BACKEND_IMAGE:-ghcr.io/multica-ai/multica-backend}:${MULTICA_IMAGE_TAG:-latest}
    # [mac-mini-m4] Explicit container name: Caddy reverse-proxies to
    # `multica-backend` by DNS name, so it cannot depend on Compose's
    # auto-generated `<project>-<service>-<n>` naming.
    container_name: multica-backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend_uploads:/app/data/uploads
    networks:
      - multica-net
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-multica}:${POSTGRES_PASSWORD:-multica}@postgres:5432/${POSTGRES_DB:-multica}?sslmode=disable
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to a strong random value — generate one with 'openssl rand -hex 32'}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://192.168.50.248:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      MULTICA_TRUSTED_PROXIES: ${MULTICA_TRUSTED_PROXIES:-}
      # Email — SMTP takes priority over Resend when SMTP_HOST is set.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@multica.ai}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_TLS: ${SMTP_TLS:-}
      SMTP_TLS_INSECURE: ${SMTP_TLS_INSECURE:-false}
      APP_ENV: ${APP_ENV:-production}
      MULTICA_DEV_VERIFICATION_CODE: ${MULTICA_DEV_VERIFICATION_CODE:-}
      MULTICA_APP_URL: ${FRONTEND_ORIGIN:-http://192.168.50.248:3000}
      # [mac-mini-m4] The API URL advertised to remote daemons. Set explicitly
      # because the fallback chain (…_DAEMON_SERVER_URL → MULTICA_PUBLIC_URL →
      # MULTICA_APP_URL) would otherwise advertise the frontend origin, and a
      # daemon speaks /api/daemon/* to the backend rather than to Next.js.
      # Caddy forwards that path; the backend's own 8080 stays loopback-only.
      MULTICA_DAEMON_SERVER_URL: ${MULTICA_DAEMON_SERVER_URL:-}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      DISABLE_WORKSPACE_CREATION: ${DISABLE_WORKSPACE_CREATION:-}
      DO_NOT_TRACK: ${DO_NOT_TRACK:-}
      # Self-hosted Git integration (Forgejo / Gitea / GitLab). Enabled by
      # default upstream on self-host; needs MULTICA_VCS_SECRET_KEY to work.
      MULTICA_VCS_INTEGRATION_ENABLED: ${MULTICA_VCS_INTEGRATION_ENABLED:-true}
      MULTICA_VCS_SECRET_KEY: ${MULTICA_VCS_SECRET_KEY:-}
    restart: unless-stopped

  frontend:
    image: ${MULTICA_WEB_IMAGE:-ghcr.io/multica-ai/multica-web}:${MULTICA_IMAGE_TAG:-latest}
    container_name: multica-frontend
    depends_on:
      - backend
    ports:
      # [mac-mini-m4] 3001, not 3000 — Caddy owns 3000 as the LAN entry point.
      - "127.0.0.1:${FRONTEND_PORT:-3001}:3000"
    networks:
      - multica-net
    environment:
      HOSTNAME: "0.0.0.0"
      # Next.js rewrites /v1, /api, /auth and /uploads to this URL. Containers
      # share multica-net, so the Compose service name resolves directly.
      REMOTE_API_URL: ${REMOTE_API_URL:-http://backend:8080}
      DOCS_URL: ${DOCS_URL:-}
      # Left empty deliberately: with no baked-in API/WS URL the browser uses
      # same-origin relative paths, which avoids the cross-host cookie and CSRF
      # problems documented upstream. See README ("Why a reverse proxy").
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    restart: unless-stopped

volumes:
  pgdata:
  backend_uploads:

networks:
  # [mac-mini-m4] Named explicitly so ../caddy/ can attach to it as an external
  # network. The two stacks start and stop independently.
  multica-net:
    name: multica-net