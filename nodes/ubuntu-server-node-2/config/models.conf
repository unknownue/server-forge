# Model registry for ubuntu-server-node-2.
# Format: "MODEL_ID|REVISION|FORMAT"
# FORMAT is optional (defaults to safetensors).
#   safetensors — safetensors weights + common configs/tokenizer
#   gguf        — all GGUF files + common configs/tokenizer
#   gguf:<quant> — GGUF matching <quant> + common (e.g. gguf:Q4_K_M)
#   full        — no filtering
#   "-"         — explicit default (same as safetensors)
#   <glob> ...  — custom allow_patterns
#
# NOTE: this node has 2× 24 GB AMD cards (48 GB total).
#
# The SGLang gfx1100 reproduction (lcz.me/topic/1532) needs a **W4A16 GPTQ**
# safetensors checkpoint, not GGUF: the fork's RDNA3 kernels are built for the
# GPTQ/vLLM-derived path, and the post's whole premise is replacing llama.cpp
# (GGUF) with SGLang. The repo below is the exact base checkpoint named in the
# fork README. After download it must be patched (see
# nodes/ubuntu-server-node-2/serve/patch-mtp-quant-config.sh) to fix the MTP
# quantization_config before SGLang can load it.
MODELS=(
    # Base checkpoint for the gfx1100 SGLang fork (18.7 GiB).
    "Vishva007/Qwen3.8-27B-W4A16-AutoRound-GPTQ|1b9d56b428e9f841d7ad566f87660b5f47553c97|full"
)