# Sunshine configuration — ubuntu-server-node-2
#
# This file is the version-controlled source of truth. Apply it with:
#     bash nodes/ubuntu-server-node-2/sunshine/install.sh
# which copies it to ~/.config/sunshine/sunshine.conf.
#
# Setup: **headless KMS capture on card1 (0000:08:00.0 / renderD129)** via an
# HDMI/DP dummy plug, with AMD VCN hardware encoding through the Vulkan path.
#
# ---------------------------------------------------------------------------
# Why card1, and why this is genuinely headless
# ---------------------------------------------------------------------------
# The two candidate GPUs:
#
#   card0 (0000:05:00.0, renderD128) — drives the physical monitor on HDMI-A-1.
#                                      Also the primary GPU for SGLang TP=2.
#                                      ~1.3 GiB VRAM free.
#   card1 (0000:08:00.0, renderD129) — dummy plug on DP-4. ~2.1 GiB VRAM free.
#
# card1 is the target. A dummy plug (EDID emulator) presents a fake monitor, so
# the connector reports `connected` and exposes a real EDID with real modes —
# but there is no actual display. KMS therefore has a permanent framebuffer to
# grab, independent of whether a monitor is on, whether anyone is logged in, or
# whether a compositor is running. That is what makes this headless, and it is
# why card0 (which stops working when its physical monitor is powered off) was
# only ever the interim setup.
#
# The dummy plug here is on a **DisplayPort** connector (DP-4), not HDMI — do not
# assume the port from the plug's shape. Always confirm from sysfs:
#     bash sunshine/sunshine-status.sh
# which cross-checks output_name/adapter_name against sysfs and fails loudly on a
# mismatch, so a stale config cannot silently half-work.

# ---------------------------------------------------------------------------
# Capture: KMS, not the Wayland portal
# ---------------------------------------------------------------------------
# KMS (kernel mode setting) reads the framebuffer straight from the DRM device.
# This keeps capture off the Wayland/portal path, which needs a live compositor
# session and a portal grant, and which fails with "Couldn't find monitor [0]"
# when no compositor is driving the card. KMS does not care — with a dummy plug
# it works with no session at all.
#
# `output_name` selects the connector Sunshine captures: the dummy plug on card1.
output_name = DP-4

# Which DRM device / GPU to encode with. renderD129 is card1.
#
# card1 is preferred over card0 because it has more free VRAM (~2.1 vs ~1.3 GiB)
# and is not driving the desktop. Both cards are heavily loaded by SGLang TP=2,
# so headroom matters: encoding runs on the GPU's dedicated VCN block and does
# not contend with the HIP/compute queues, but its frame buffers come out of the
# free VRAM. If SGLang is later retuned upward (--mem-fraction-static) and
# streams start failing to allocate, this is the first thing to check.
adapter_name = /dev/dri/renderD129

# ---------------------------------------------------------------------------
# Encoder: AMD hardware (VCN) through Vulkan
# ---------------------------------------------------------------------------
# The package on this machine ships Vulkan-backed encoders only (there is no
# separate VAAPI encoder list, and the AMD VAAPI driver is not exercised).
#
# VERIFIED ON THIS MACHINE (2026-09-19). Sunshine validates the named encoder at
# startup with a test encode, and which ones PASS depends on the capture backend
# that is active — this caught us out once already:
#
#   capture path              h264_vulkan   av1_vulkan   hevc_vulkan
#   ------------------------  -----------   ----------   -----------
#   KMS/DRM (manual probe)      PASS          PASS          FAIL
#   Wayland portal (service)    PASS          FAIL          FAIL
#
# Failure mode is a warning in the journal and a silent fall-through to the
# probe order — NOT a startup error:
#     Error: Couldn't find any working encoder matching [av1_vulkan]
#
# AV1/HEVC are only validated against a KMS/DRM surface. While a GNOME Wayland
# session is live, Sunshine prefers the portal backend, and there only H.264
# passes. HEVC fails on both paths despite Mesa advertising
# VK_KHR_video_encode_h265 (verified with strings on libvulkan_radeon.so), so it
# is a Sunshine/Mesa validation-path issue rather than a missing extension.
#
# Default is therefore h264_vulkan: it is the only encoder that validates in
# every configuration here, and every Moonlight client can decode it. This is
# the safe, boring choice — switch to av1_vulkan only after confirming it
# validates in your actual runtime context, via sunshine-status.sh.
#
# Since this config pins output_name to a DRM connector, the KMS path is the one
# that actually runs, so h264_vulkan and av1_vulkan should both pass; leave the
# default at h264_vulkan for maximum client compatibility and revisit once a
# client is confirmed to decode AV1.
encoder = h264_vulkan

# Codec usage modes. 1 = the client may request that codec, so Moonlight can
# still negotiate AV1/HEVC per-session when the runtime supports it. Setting 0
# forbids the codec outright, which would make the fallback permanent.
hevc_mode = 1
av1_mode = 1

# NOTE: there is deliberately no `fps` here. Frame rate is negotiated per client
# by Moonlight, not set server-side; `fps` is not a recognized option and
# Sunshine warns "Unrecognized configurable option [fps]" if you add it.
#
# Hardware encoding is essentially free on the GPU's dedicated VCN block and
# does not touch the HIP/compute queues the LLM uses — but it does consume some
# VRAM for the encoder's frame buffers, so keep the stream resolution sane.
# See README.md "GPU cost" for the numbers behind this.

# ---------------------------------------------------------------------------
# Bitrate / quality
# ---------------------------------------------------------------------------
# These are per-client defaults; Moonlight can override at connect time.
# On a LAN, HEVC at 1080p60 is comfortable around 20-30 Mbps.
qp = 28
# sw_preset only applies if the encoder falls back to software — kept low so a
# fallback does not saturate the CPU.
sw_preset = superfast

# ---------------------------------------------------------------------------
# Display device configuration (libdisplaydevice)
# ---------------------------------------------------------------------------
# `disabled` means Sunshine will NOT try to reconfigure the display. This is
# deliberate for a headless KMS target: there is no X11/Wayland display server
# managing these outputs, and letting Sunshine attempt mode changes on a
# dummy-plug output is a common source of "stream starts then dies" behavior.
# The dummy plug's EDID is what defines the available modes — pick the
# resolution by choosing the right dummy plug, or let the client scale.
dd_configuration_option = disabled

# ---------------------------------------------------------------------------
# Network / Web UI
# ---------------------------------------------------------------------------
# 0.0.0.0 so Moonlight clients on the LAN can reach it. This host is on
# 192.168.50.143. Restrict to `lan` (the default) — do not expose to the
# internet: the Web UI is what pairs clients, and it holds the credentials.
origin_web_ui_allowed = lan

# CSRF allow-list for the Web UI.
#
# Sunshine only trusts a fixed set of default origins, built in as:
#     https://127.0.0.1   https://localhost   https://[::1]
# Note these are loopback-only and carry NO port. Reaching the UI by this host's
# LAN address therefore trips the protection and every login POST is rejected:
#
#     Error: Web UI: [192.168.50.143] -- CSRF protection blocked request
#            from origin: https://192.168.50.143:47990
#
# Adding the exact origin the browser sends fixes it. It must include the scheme
# AND the port, and must match what is in the address bar — a mismatch (http vs
# https, or a missing :47990) is silently not trusted and the same error returns.
# Bad entries are rejected at startup with:
#     Invalid 'csrf_allowed_origins' entry rejected: <value>
#
# List every address you actually browse from. If this host's IP ever changes
# (it is DHCP — currently 192.168.50.143), update this line or the block returns.
csrf_allowed_origins = https://192.168.50.143:47990, https://localhost:47990, https://127.0.0.1:47990

# Ports (defaults, listed for clarity; see README.md for the firewall set):
#   47984/tcp  HTTPS web UI + pairing
#   47989/tcp  HTTP web UI
#   47990/tcp  Web UI (current)
#   48010/tcp  RTSP control
#   47998-48000/udp  video/audio/control streams

# UPnP off: this is a fixed LAN host with a known address, and punching holes in
# the router for a game stream host is not desirable.
upnp = off

# ---------------------------------------------------------------------------
# Input
# ---------------------------------------------------------------------------
# uhid is loaded and gives Sunshine kernel-level virtual gamepads that work
# without a compositor. This is the default; listed so the dependency is
# explicit and greppable.
gamepad = uhid

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
# `info` is the right level for a service that should stay quiet in normal
# operation. Raise to `debug` temporarily when diagnosing capture problems —
# the KMS connector negotiation is logged there.
min_log_level = info