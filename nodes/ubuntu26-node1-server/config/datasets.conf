# Dataset registry for ubuntu26-node1-server.
# Format: "DATASET_ID|REVISION|FORMAT"
# FORMAT is optional (defaults to full).
#   full        — no filtering, download everything (default)
#   "-"         — explicit default (same as full)
#   parquet     — only *.parquet + common configs
#   json        — only *.json + common configs
#   <glob> ...  — custom allow_patterns (space-separated)
#
# Datasets are stored at /data/work/datasets/<dataset_name>/
DATASETS=(
    # ── Reasoning / SFT data ──
    "agentica-org/DeepScaleR-Preview-Dataset|main"
)
