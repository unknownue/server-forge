# ComfyUI model registry for ubuntu26-node1-server.
# Format: "MODEL_ID|REVISION|FORMAT"
# FORMAT is optional (defaults to full).
#   full        — no filtering, download everything (default for ComfyUI models)
#   "-"         — explicit default (same as full)
#   <glob> ...  — custom allow_patterns (space-separated)
#
# Models are stored at /data/work/models/comfyui/<model_name>/
COMFYUI_MODELS=(
    # ── Video generation ──
    "circlestone-labs/Anima|main"
)
