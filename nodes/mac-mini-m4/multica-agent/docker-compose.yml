# Multica agent runtime — containerised daemon + dsh.
#
# Deploy this on the DEVELOPMENT machine (the one holding the repos and running
# the local models), NOT on the machine hosting the Multica server.
#
# Isolation model — the two mount choices are the whole point:
#
#   /repos         bind-mounted, read-write. This is the work product surface:
#                  what an agent changes must land in the developer's real
#                  repository. Everything else the run touches stays inside the
#                  container.
#
#   /dsh-home      a NAMED VOLUME, never the host's ~/.dsh. Multica resolves
#                  the DSH profile store from DSH_HOME (dsh_profile.go), and
#                  dsh honours the same variable, so the container's profiles,
#                  plugins and sessions live in their own filesystem tree.
#                  The host's own dsh — the one the user maintains — is
#                  therefore untouched by anything that happens here, including
#                  an agent that rewrites its own runtime.
#
#   /multica-home  a NAMED VOLUME holding the daemon's PAT config and per-run
#                  session roots, so the container can be recreated without
#                  re-authenticating.
#
# Upstream is explicit that a run is otherwise unsandboxed: "if the daemon runs
# as your personal user account, a run can read your SSH keys, edit your shell
# profile, and delete your documents" (security-model.mdx). Treat the container
# plus the /repos scope as the boundary, and do not widen it casually.

name: multica-agent

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # arm64 on Apple Silicon / ARM servers; amd64 on x86. Override in .env
        # when building for a different architecture than the build host.
        TARGETARCH: ${TARGETARCH:-arm64}
        MULTICA_VERSION: ${MULTICA_VERSION:-v0.5.2}
        # Must stay on the release line the vendored bridge was validated
        # against. A newer dsh resolves @deepseek-ai/dsh-sandbox-local to a
        # version whose transitive deps are unpublished, and the profile then
        # probes fine while failing every task. See the Dockerfile.
        DSH_VERSION: ${DSH_VERSION:-0.1.0-rc.6}
        DSH_SANDBOX_VERSION: ${DSH_SANDBOX_VERSION:-0.1.0-rc.6}
        # Optional mirror prefix for the GitHub release download, e.g.
        # "https://ghproxy.example/". github.com is unreachable from some
        # networks even when api.github.com works.
        GH_PROXY: ${GH_PROXY:-}
    image: multica-agent:local
    container_name: multica-agent

    # The daemon dials the Multica server on the LAN. Host networking is NOT
    # used: the container needs no inbound port, and the default bridge keeps
    # it off the LAN interface entirely.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      # Required at RUN time, but deliberately not enforced by Compose's
      # `${VAR:?}` form: that syntax is evaluated for every subcommand,
      # including `docker compose build`, so the image would be unbuildable
      # before a token exists. The entrypoint is the real gate — it refuses to
      # start without both values, which keeps the check on the path that
      # actually needs it while leaving build and `config` usable.
      MULTICA_SERVER_URL: ${MULTICA_SERVER_URL:-}
      MULTICA_TOKEN: ${MULTICA_TOKEN:-}
      MULTICA_APP_URL: ${MULTICA_APP_URL:-}

      # Container-owned homes, matching the Dockerfile.
      DSH_HOME: /dsh-home
      MULTICA_HOME: /multica-home

      # Git identity for the commits an agent makes on its delivery branch.
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-multica-agent}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-multica-agent@localhost}

      # Neutralise any proxy inherited from the host build/run environment.
      # A proxy that cannot resolve LAN addresses turns "server unreachable"
      # into a confusing timeout, and the daemon's own traffic here is all
      # LAN-local.
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"

    volumes:
      # ── The work product: real repositories, read-write ──
      # Left side is set per machine in .env. Point it at the directory that
      # actually holds the repos the agents should work on — the narrower the
      # better. Mounting $HOME would hand a run the developer's entire home.
      #
      # Defaulted to a never-created path so `build` and `config` work before
      # .env is filled in; deploy.sh validates the real value and refuses to
      # start until it points at an existing, non-home directory.
      - ${REPOS_DIR:-/nonexistent-set-REPOS_DIR}:/repos

      # ── Container-private state (never the host's ~/.dsh) ──
      - dsh_home:/dsh-home
      - multica_home:/multica-home

    restart: unless-stopped

    # An agent run is unbounded work: builds, test suites, dependency
    # installs. No memory cap is imposed here because the right ceiling is a
    # property of the machine, not of the image. Set one if this host is
    # shared, e.g.:
    #   deploy:
    #     resources:
    #       limits:
    #         memory: 8g

    healthcheck:
      # `daemon status` is the honest probe: it reports whether the daemon
      # actually connected and registered runtimes, which a bare process check
      # would miss.
      test: ["CMD-SHELL", "multica daemon status 2>&1 | grep -qi running"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 90s

volumes:
  dsh_home:
    name: multica-agent-dsh-home
  multica_home:
    name: multica-agent-home