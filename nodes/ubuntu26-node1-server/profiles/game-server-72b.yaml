# Game Studio 72B: 72B Dense TP=2 + 27B + FLUX.2
name: "game-server-72b"
description: "Game Studio: 72B Dense (TP=2) + 27B multimodal + FLUX.2"
version: "1.0"

gpu_allocation:
  - gpu: [0, 1]
    role: "text-inference"
    model: "Qwen/Qwen3-72B"
    model_short: "Qwen3-72B-FP8"
    port: 8000
    tp: 2
    container_name: "gs-72b-coord"
    serve:
      script: "serve/sglang-text.sh"
      args:
        - "/data/work/models/Qwen/Qwen3-72B"
        - "0,1"
        - "8000"
        - "2"
        - "--quantization fp8 --context-length 131072 --max-running-requests 1 --reasoning-parser qwen3 --tool-call-parser qwen3_coder --served-model-name Qwen3-72B-FP8"

  - gpu: [2]
    role: "text-inference"
    model: "Qwen/Qwen3.6-27B"
    model_short: "Qwen3.6-27B-FP8"
    port: 8001
    container_name: "gs-27b-fast"
    serve:
      script: "serve/sglang-text.sh"
      args:
        - "/data/work/models/Qwen/Qwen3.6-27B"
        - "2"
        - "8001"
        - "1"
        - "--context-length 65536 --quantization fp8 --max-running-requests 2 --reasoning-parser qwen3 --tool-call-parser qwen3_coder --served-model-name Qwen3.6-27B-FP8"

  - gpu: [3]
    role: "image-generation"
    model: "FLUX.2-dev"
    port: 8188
    container_name: "gs-comfyui"
    serve:
      script: "serve/comfyui.sh"
      args: ["3", "8188"]

stop_containers:
  - "gs-72b-coord"
  - "gs-27b-fast"
  - "gs-comfyui"
