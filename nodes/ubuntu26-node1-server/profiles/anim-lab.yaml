# Animation Lab: ComfyUI for image/video generation
name: "anim-lab"
description: "Animation Lab: image & video generation services"
version: "1.0"

gpu_allocation:
  - gpu: [0]
    role: "image-generation"
    model: "FLUX.2-dev"
    port: 8188
    container_name: "al-comfyui"
    serve:
      script: "serve/comfyui.sh"
      args: ["0", "8188"]

stop_containers:
  - "al-comfyui"
