# Server-Forge Node Inventory
# Index of all managed nodes. Detailed config lives in nodes/<hostname>/.

nodes:
  ubuntu26-node1-server:
    ip: 10.0.0.101

  ubuntu-server-node-2:
    ip: 192.168.50.143

  unknownue-manjaro:
    ip: dhcp

  mac-mini-m4:
    ip: 192.168.50.248
    hostname: unknownue-servers-Mac-mini.local
    roles:
      # Serves the Multica control plane only. Agent execution runs on separate
      # LAN development machines; how each one installs its daemon is managed
      # there, not here.
      - multica-server
    services:
      - name: multica
        url: http://192.168.50.248:3000
        note: >-
          Self-hosted AI agent workspace, CONTROL PLANE ONLY. Stack in
          nodes/mac-mini-m4/multica/. The backend advertises
          MULTICA_DAEMON_SERVER_URL so remote daemons reach the API through
          Caddy's /api/daemon/* route rather than the loopback-bound 8080.
      - name: caddy
        url: http://192.168.50.248:3000
        note: >-
          Reverse proxy and the single LAN-facing port for multica. Forwards
          /api/daemon/* and /ws to the backend, everything else to the
          frontend. Required for WebSocket/real-time. See
          nodes/mac-mini-m4/caddy/.
      - name: dsh-web
        url: http://192.168.50.248:3080
        note: >-
          The DeepSeek Harness Web GUI, in PERMANENT LAN mode: a plain
          `dsh web` binds 0.0.0.0 with no flags or wrapper. The setting is a
          dsh profile patch tracked at
          nodes/mac-mini-m4/config/dsh-web-lan.patch.yml and installed into
          ~/.dsh/profiles/web/cordis.patch.yml by config/install-dsh-lan.sh,
          because this build's CLI refuses --host 0.0.0.0. Access requires the
          tokenised URL dsh prints. Deliberately NOT behind Caddy: on Docker
          Desktop a container cannot reach the host's loopback, so no
          container-based proxy can front it.

    # Agent runtimes are deliberately absent. This host is the control plane;
    # daemons and the models behind them live on the LAN development machines,
    # and their installation is managed there rather than from this repo.

  windows-4090:
    ip: dhcp
    hostname: SK-20260811BZVK
    roles:
      - workstation
    note: >-
      Windows 11 Pro workstation (Ryzen 7 9800X3D + RTX 4090). Primary
      development machine; the server-forge repo is checked out at
      D:\dev\server-forge and managed through Git Bash. No Docker installed.
      See nodes/windows-4090/ for details.
