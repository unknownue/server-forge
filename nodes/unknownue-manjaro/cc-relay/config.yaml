# cc-relay Configuration — unknownue-manjaro
#
# Proxy for Claude Code to route requests across multiple AI providers.
# Routes: Nemotron-Orchestrator → local CLASP → vLLM
#         Qwen3.6-35B-* → remote SGLang :8001 (MoE)
#         Qwen3.6-27B-* → remote SGLang :8000 (Long context)

server:
  listen: "127.0.0.1:8787"
  timeout_ms: 600000
  max_concurrent: 0
  enable_http2: true

  auth:
    api_key: "not-needed"

routing:
  strategy: "model_based"
  model_mapping:
    "Nemotron-Orchestrator": "local-nemotron"
    "Qwen3.6-35B": "remote-moe"
    "Qwen3.6-27B": "remote-long"
  default_provider: "remote-moe"
  debug: false

providers:
  # ── Local nemotron-orchestrator (via CLASP Anthropic→OpenAI proxy) ──
  - name: "local-nemotron"
    type: "anthropic"
    enabled: true
    base_url: "http://127.0.0.1:8080"
    models:
      - "Nemotron-Orchestrator-8B-AWQ-8bit"
    keys:
      - key: "dummy"

  # ── Remote game server :8001 — MoE (128K, 2 concurrent) ──
  - name: "remote-moe"
    type: "anthropic"
    enabled: true
    base_url: "http://192.168.50.135:8001"
    models:
      - "Qwen3.6-35B-A3B-FP8"
    keys:
      - key: "not-needed"

  # ── Remote game server :8000 — Long context (192K, solo) ──
  - name: "remote-long"
    type: "anthropic"
    enabled: true
    base_url: "http://192.168.50.135:8000"
    models:
      - "Qwen3.6-27B-FP8"
    keys:
      - key: "not-needed"

cache:
  mode: single
  ristretto:
    num_counters: 1000000
    max_cost: 104857600
    buffer_items: 64

grpc:
  listen: "127.0.0.1:9090"

logging:
  level: "info"
  format: "text"

metrics:
  enabled: true
  prometheus_endpoint: "/metrics"
  prometheus_listen: "127.0.0.1:9100"

health:
  health_check:
    enabled: true
    interval_ms: 10000
  circuit_breaker:
    failure_threshold: 5
    open_duration_ms: 30000
    half_open_probes: 3
